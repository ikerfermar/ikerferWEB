<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Cadena funcional de un sistema de intrusión</title>
  <desc id="desc">Los detectores envían información por cable, bus o radio a una central. La central puede activar un aviso local y transmitir la señal mediante una red IP o móvil a una central receptora de alarmas.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0969da"/></marker></defs>
  <rect width="1200" height="570" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#1f2328">
    <text x="60" y="54" font-size="28" font-weight="700">Sistema de intrusión</text>
    <text x="60" y="84" font-size="17" fill="#57606a">Una misma decisión puede generar respuesta local, comunicación exterior y registro.</text>
    <g text-anchor="middle">
      <rect x="60" y="135" width="225" height="190" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
      <path d="M105 190h58M134 161v58" stroke="#57606a" stroke-width="4"/><path d="M195 165q34 25 0 50M207 152q52 38 0 76" fill="none" stroke="#57606a" stroke-width="4"/>
      <text x="172" y="255" font-size="20" font-weight="700">Entradas</text>
      <text x="172" y="281" font-size="16" fill="#57606a">PIR · contacto · barrera</text>
      <text x="172" y="305" font-size="16" fill="#57606a">pulsador</text>

      <rect x="365" y="135" width="210" height="190" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
      <path d="M410 197h120" stroke="#0969da" stroke-width="4" stroke-dasharray="9 7"/><circle cx="410" cy="197" r="9" fill="#0969da"/><circle cx="530" cy="197" r="9" fill="#0969da"/>
      <text x="470" y="255" font-size="20" font-weight="700">Enlace</text>
      <text x="470" y="281" font-size="16" fill="#57606a">cable · bus · radio</text>

      <rect x="655" y="135" width="210" height="190" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
      <rect x="720" y="163" width="80" height="66" rx="5" fill="none" stroke="#0969da" stroke-width="4"/><circle cx="740" cy="250" r="7" fill="#1a7f37"/><circle cx="760" cy="250" r="7" fill="#bf8700"/><circle cx="780" cy="250" r="7" fill="#cf222e"/>
      <text x="760" y="281" font-size="20" font-weight="700">Central</text>
      <text x="760" y="305" font-size="16" fill="#57606a">decide y registra</text>

      <rect x="950" y="115" width="190" height="120" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
      <path d="M995 151v42h24l21 15v-72l-21 15z" fill="none" stroke="#bf8700" stroke-width="4"/><path d="M1050 151q23 20 0 40" fill="none" stroke="#bf8700" stroke-width="4"/>
      <text x="1045" y="221" font-size="18" font-weight="700">Aviso local</text>
      <rect x="950" y="270" width="190" height="120" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
      <path d="M987 320h116M1007 302l-20 18 20 18M1083 302l20 18-20 18" fill="none" stroke="#1a7f37" stroke-width="4"/>
      <text x="1045" y="372" font-size="18" font-weight="700">Red IP o móvil</text>
      <rect x="950" y="435" width="190" height="75" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
      <text x="1045" y="468" font-size="19" font-weight="700">CRA</text><text x="1045" y="493" font-size="15" fill="#57606a">recepción y gestión</text>
    </g>
    <g stroke="#0969da" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M285 230h70"/><path d="M575 230h70"/><path d="M865 215h75"/><path d="M865 275q45 0 75 35"/><path d="M1045 390v35"/></g>
    <rect x="365" y="410" width="500" height="100" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="615" y="447" text-anchor="middle" font-size="19" font-weight="700">Alimentación supervisada</text>
    <text x="615" y="478" text-anchor="middle" font-size="17" fill="#57606a">red + fuente + batería; su fallo es una avería, no una intrusión</text>
    <path d="M760 410v-75" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="60" y="545" font-size="16" fill="#57606a">CRA: Central Receptora de Alarmas. La transmisión exterior no sustituye al funcionamiento local.</text>
  </g>
</svg>
