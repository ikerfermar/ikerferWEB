<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Comparación de cuatro arquitecturas de detección de incendios</title>
  <desc id="desc">Cuatro paneles comparan sistemas convencional, direccionable, analógico direccionable e inalámbrico mediante su conexión y la información que recibe la central.</desc>
  <rect width="1200" height="680" fill="#f6f8fa"/>
  <style>
    .card{fill:#fff;stroke:#8c959f;stroke-width:2}.head{fill:#0969da}.title{font:700 24px Arial,sans-serif;fill:#fff}.label{font:600 18px Arial,sans-serif;fill:#1f2328}.small{font:16px Arial,sans-serif;fill:#4b5563}.wire{stroke:#57606a;stroke-width:4;fill:none}.radio{stroke:#0969da;stroke-width:3;fill:none;stroke-dasharray:10 8}.device{fill:#ddf4ff;stroke:#0969da;stroke-width:2}.panel{fill:#fff8c5;stroke:#9a6700;stroke-width:2}.accent{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
  </style>
  <rect class="card" x="35" y="35" width="545" height="285" rx="12"/>
  <path class="head" d="M47 35h521a12 12 0 0 1 12 12v48H35V47a12 12 0 0 1 12-12z"/>
  <text class="title" x="60" y="75">Convencional</text>
  <rect class="panel" x="65" y="145" width="130" height="90" rx="8"/><text class="label" x="92" y="182">Central</text><text class="small" x="82" y="209">indica zona</text>
  <path class="wire" d="M195 170H290V130H515M290 170H515M290 210H515"/>
  <circle class="device" cx="360" cy="130" r="25"/><circle class="device" cx="455" cy="130" r="25"/>
  <circle class="device" cx="360" cy="170" r="25"/><circle class="device" cx="455" cy="170" r="25"/>
  <circle class="device" cx="360" cy="210" r="25"/><circle class="device" cx="455" cy="210" r="25"/>
  <text class="small" x="65" y="275">Varias líneas agrupan dispositivos por zonas.</text>

  <rect class="card" x="620" y="35" width="545" height="285" rx="12"/>
  <path class="head" d="M632 35h521a12 12 0 0 1 12 12v48H620V47a12 12 0 0 1 12-12z"/>
  <text class="title" x="645" y="75">Direccionable</text>
  <rect class="panel" x="650" y="145" width="130" height="90" rx="8"/><text class="label" x="677" y="182">Central</text><text class="small" x="667" y="209">indica punto</text>
  <path class="wire" d="M780 190C825 115 1040 115 1100 190C1040 265 825 265 780 190"/>
  <circle class="device" cx="870" cy="135" r="27"/><text class="small" x="860" y="141">01</text>
  <circle class="device" cx="1005" cy="135" r="27"/><text class="small" x="995" y="141">02</text>
  <circle class="device" cx="1005" cy="245" r="27"/><text class="small" x="995" y="251">03</text>
  <circle class="device" cx="870" cy="245" r="27"/><text class="small" x="860" y="251">04</text>
  <text class="small" x="650" y="285">El lazo identifica cada dirección y su estado.</text>

  <rect class="card" x="35" y="360" width="545" height="285" rx="12"/>
  <path class="head" d="M47 360h521a12 12 0 0 1 12 12v48H35v-48a12 12 0 0 1 12-12z"/>
  <text class="title" x="60" y="400">Analógico direccionable</text>
  <rect class="panel" x="65" y="470" width="130" height="90" rx="8"/><text class="label" x="92" y="507">Central</text><text class="small" x="79" y="534">valora señal</text>
  <path class="wire" d="M195 515C245 445 465 445 525 515C465 585 245 585 195 515"/>
  <circle class="accent" cx="290" cy="463" r="29"/><text class="small" x="279" y="469">18</text>
  <circle class="accent" cx="430" cy="463" r="29"/><text class="small" x="419" y="469">42</text>
  <circle class="accent" cx="430" cy="567" r="29"/><text class="small" x="419" y="573">67</text>
  <circle class="accent" cx="290" cy="567" r="29"/><text class="small" x="279" y="573">25</text>
  <text class="small" x="65" y="610">Cada punto comunica identidad y valor de medida.</text>

  <rect class="card" x="620" y="360" width="545" height="285" rx="12"/>
  <path class="head" d="M632 360h521a12 12 0 0 1 12 12v48H620v-48a12 12 0 0 1 12-12z"/>
  <text class="title" x="645" y="400">Inalámbrico o híbrido</text>
  <rect class="panel" x="650" y="470" width="145" height="90" rx="8"/><text class="label" x="665" y="507">Central o</text><text class="small" x="674" y="534">pasarela radio</text>
  <path class="radio" d="M800 500Q880 430 960 500M800 530Q900 620 1010 530"/>
  <circle class="device" cx="955" cy="470" r="30"/><circle class="device" cx="1045" cy="535" r="30"/><circle class="device" cx="920" cy="575" r="30"/>
  <path class="wire" d="M795 545H840V575H1110"/>
  <text class="small" x="650" y="620">Supervisa enlace radio, batería y dispositivos cableados.</text>
</svg>
