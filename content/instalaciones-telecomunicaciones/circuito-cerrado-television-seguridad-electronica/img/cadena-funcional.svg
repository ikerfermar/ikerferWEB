<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Cadena funcional de un sistema de seguridad electrónica</title>
  <desc id="desc">Un evento es captado por un detector, transmitido a una unidad de control y convertido en aviso, actuación o registro. La alimentación y supervisión sostienen todo el recorrido.</desc>
  <rect width="900" height="350" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#17202a">
    <text x="42" y="40" font-size="22" font-weight="700">Del evento a la respuesta</text>
    <g font-size="17" text-anchor="middle">
      <rect x="42" y="75" width="240" height="78" rx="6" fill="#eef4fb" stroke="#395a78"/>
      <text x="162" y="110" font-weight="700">Captación</text><text x="162" y="135">sensor, cámara o pulsador</text>
      <rect x="330" y="75" width="240" height="78" rx="6" fill="#eef4fb" stroke="#395a78"/>
      <text x="450" y="110" font-weight="700">Transmisión</text><text x="450" y="135">cable, radio o red IP</text>
      <rect x="618" y="75" width="240" height="78" rx="6" fill="#eef4fb" stroke="#395a78"/>
      <text x="738" y="110" font-weight="700">Control</text><text x="738" y="135">interpreta y decide</text>
      <rect x="42" y="205" width="240" height="78" rx="6" fill="#f4f7f5" stroke="#4b705b"/>
      <text x="162" y="240" font-weight="700">Aviso y actuación</text><text x="162" y="265">sirena, relé o notificación</text>
      <rect x="330" y="205" width="240" height="78" rx="6" fill="#f4f7f5" stroke="#4b705b"/>
      <text x="450" y="240" font-weight="700">Registro</text><text x="450" y="265">evento o imagen</text>
      <rect x="618" y="205" width="240" height="78" rx="6" fill="#fff7ea" stroke="#946b30"/>
      <text x="738" y="240" font-weight="700">Supervisión</text><text x="738" y="265">avería y sabotaje</text>
    </g>
    <g stroke="#395a78" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M282 114h47m-10-8 10 8-10 8"/><path d="M570 114h47m-10-8 10 8-10 8"/>
      <path d="M738 153v33H162v18m-8-10 8 10 8-10"/>
      <path d="M282 244h47m-10-8 10 8-10 8"/>
      <path d="M570 244h47m-10-8 10 8-10 8"/>
    </g>
    <text x="42" y="325" font-size="15" fill="#3f4f60">La alimentación principal y de respaldo debe sostener los bloques que la necesiten.</text>
  </g>
</svg>
