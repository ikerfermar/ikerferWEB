<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Cadena funcional de control de accesos</title>
  <desc id="desc">La credencial se presenta al lector, el controlador decide si autoriza y gobierna la cerradura. El contacto de puerta devuelve su estado y el sistema registra el evento.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0969da"/></marker></defs>
  <rect width="1200" height="570" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#1f2328">
    <text x="60" y="54" font-size="28" font-weight="700">Control de accesos de una puerta</text>
    <text x="60" y="84" font-size="17" fill="#57606a">La autorización, la apertura física y el registro son funciones relacionadas, pero no idénticas.</text>
    <g text-anchor="middle">
      <rect x="45" y="145" width="190" height="150" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
      <rect x="92" y="178" width="96" height="55" rx="7" fill="none" stroke="#57606a" stroke-width="4"/><circle cx="115" cy="205" r="10" fill="#57606a"/><path d="M135 195h35M135 211h25" stroke="#57606a" stroke-width="4"/>
      <text x="140" y="266" font-size="20" font-weight="700">Credencial</text>

      <rect x="285" y="145" width="190" height="150" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
      <rect x="345" y="173" width="70" height="70" rx="9" fill="none" stroke="#0969da" stroke-width="4"/><path d="M362 198q18-18 36 0M367 209q13-12 26 0M375 220q5-5 10 0" fill="none" stroke="#0969da" stroke-width="4"/>
      <text x="380" y="266" font-size="20" font-weight="700">Lector</text>

      <rect x="525" y="145" width="190" height="150" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
      <rect x="580" y="174" width="80" height="64" rx="5" fill="none" stroke="#0969da" stroke-width="4"/><circle cx="600" cy="256" r="6" fill="#1a7f37"/><circle cx="620" cy="256" r="6" fill="#bf8700"/><circle cx="640" cy="256" r="6" fill="#cf222e"/>
      <text x="620" y="286" font-size="20" font-weight="700">Controlador</text>

      <rect x="765" y="145" width="190" height="150" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
      <path d="M815 174h90v70h-90zM885 174v70M850 208h25" fill="none" stroke="#bf8700" stroke-width="4"/><circle cx="875" cy="208" r="5" fill="#bf8700"/>
      <text x="860" y="275" font-size="20" font-weight="700">Cerradura</text>

      <rect x="1005" y="145" width="150" height="150" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
      <path d="M1040 180h80v60h-80zM1052 197h56M1052 212h43M1052 227h50" fill="none" stroke="#1a7f37" stroke-width="4"/>
      <text x="1080" y="275" font-size="20" font-weight="700">Registro</text>
    </g>
    <g stroke="#0969da" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M235 220h40"/><path d="M475 220h40"/><path d="M715 220h40"/><path d="M955 220h40"/></g>
    <rect x="270" y="385" width="220" height="95" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="380" y="420" text-anchor="middle" font-size="18" font-weight="700">Pulsador de salida</text>
    <text x="380" y="446" text-anchor="middle" font-size="14" fill="#57606a"><tspan x="380">solicita la apertura</tspan><tspan x="380" dy="19">desde el interior</tspan></text>
    <path d="M380 385v-80" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 7"/>
    <rect x="750" y="385" width="220" height="95" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="860" y="420" text-anchor="middle" font-size="18" font-weight="700">Contacto de puerta</text>
    <text x="860" y="446" text-anchor="middle" font-size="14" fill="#57606a"><tspan x="860">confirma si está</tspan><tspan x="860" dy="19">abierta o cerrada</tspan></text>
    <path d="M860 385v-80" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/>
    <rect x="455" y="500" width="590" height="45" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="750" y="529" text-anchor="middle" font-size="16">La decisión puede ser local aunque exista gestión centralizada por red.</text>
    <path d="M620 500v-195" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 7"/>
  </g>
</svg>
