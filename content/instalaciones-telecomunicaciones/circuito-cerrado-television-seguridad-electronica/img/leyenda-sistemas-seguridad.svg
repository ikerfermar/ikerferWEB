<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1228 900" role="img" aria-labelledby="title desc">
  <title id="title">Leyenda didáctica de elementos frecuentes en instalaciones de seguridad</title>
  <desc id="desc">Dieciocho elementos agrupados en incendios, intrusión y videovigilancia o accesos, con representación esquemática, abreviatura y nombre. La leyenda de cada proyecto determina el significado de sus símbolos.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17202a} .head{font-size:28px;font-weight:700} .group{font-size:18px;font-weight:700;fill:#0758a5} .name{font-size:17px;font-weight:600} .code{font-size:14px;fill:#526273} .small{font-size:14px;fill:#526273} .box{fill:#fff;stroke:#b8c4d1;stroke-width:1.5} .symbol{fill:none;stroke:#17202a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .dot{fill:#17202a}
  </style>
  <rect width="1228" height="900" fill="#fff"/>
  <text x="28" y="42" class="head">Elementos frecuentes en un plano de seguridad</text>
  <text x="28" y="68" class="small">Símbolos de ejemplo; identificadores, tecnología y significado se confirman siempre en la leyenda del proyecto.</text>
  <text x="28" y="109" class="group">DETECCIÓN Y ALARMA DE INCENDIOS</text>
  <text x="427" y="109" class="group">INTRUSIÓN Y ALARMA</text>
  <text x="826" y="109" class="group">CCTV Y CONTROL DE ACCESOS</text>

  <g transform="translate(28 125)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="24" width="57" height="57"/><path class="symbol" d="M56 31 37 42 55 52 37 62 55 74"/><text class="name" x="91" y="52">Detector de humos</text><text class="code" x="91" y="76">DH · capta humo</text>
  </g>
  <g transform="translate(28 243)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="24" width="57" height="57"/><path class="symbol" d="M47 31 V62"/><circle class="dot" cx="47" cy="67" r="6"/><text class="name" x="91" y="52">Detector térmico</text><text class="code" x="91" y="76">DT · capta temperatura</text>
  </g>
  <g transform="translate(28 361)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="24" width="57" height="57"/><path class="symbol" d="M32 68 47 39 62 68"/><text class="name" x="91" y="52">Detector de llama</text><text class="code" x="91" y="76">DL · capta radiación de llama</text>
  </g>
  <g transform="translate(28 479)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="24" width="57" height="57"/><circle class="dot" cx="47" cy="52" r="9"/><text class="name" x="91" y="52">Pulsador manual</text><text class="code" x="91" y="76">PM · aviso accionado por persona</text>
  </g>
  <g transform="translate(28 597)">
    <rect class="box" width="374" height="112" rx="5"/><path class="symbol" d="M19 77 25 31 H69 L75 77 Z M37 55 H47 L59 45 V68 L47 58 H37 Z"/><text class="name" x="91" y="52">Avisador acústico</text><text class="code" x="91" y="76">SI · sirena o bocina</text>
  </g>
  <g transform="translate(28 715)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="17" y="33" width="61" height="43"/><text class="name" x="91" y="52">Central de incendios</text><text class="code" x="91" y="76">CI · control y señalización</text>
  </g>

  <g transform="translate(427 125)">
    <rect class="box" width="374" height="112" rx="5"/><circle class="symbol" cx="47" cy="54" r="19"/><path class="symbol" d="M65 37 76 26 M66 54 H78 M65 71 76 82"/><text class="name" x="91" y="52">Detector PIR</text><text class="code" x="91" y="76">PIR · infrarrojo pasivo</text>
  </g>
  <g transform="translate(427 243)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="34" width="18" height="39"/><rect class="symbol" x="52" y="34" width="18" height="39"/><text class="name" x="91" y="52">Contacto magnético</text><text class="code" x="91" y="76">CM · apertura de puerta o ventana</text>
  </g>
  <g transform="translate(427 361)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="24" width="57" height="57"/><path class="symbol" d="M31 38 62 69 M61 37 32 69"/><text class="name" x="91" y="52">Detector de rotura</text><text class="code" x="91" y="76">DR · vidrio o vibración</text>
  </g>
  <g transform="translate(427 479)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="34" width="14" height="40"/><rect class="symbol" x="62" y="34" width="14" height="40"/><path class="symbol" stroke-dasharray="5 5" d="M33 54 H61"/><text class="name" x="91" y="52">Barrera infrarroja</text><text class="code" x="91" y="76">BA · emisor y receptor activos</text>
  </g>
  <g transform="translate(427 597)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="29" width="57" height="49"/><circle class="dot" cx="31" cy="64" r="3"/><circle class="dot" cx="43" cy="64" r="3"/><text class="name" x="91" y="52">Central de intrusión</text><text class="code" x="91" y="76">CA · zonas, avisos y supervisión</text>
  </g>
  <g transform="translate(427 715)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="20" y="28" width="54" height="53"/><path class="symbol" d="M31 40 H63"/><circle class="dot" cx="35" cy="55" r="3"/><circle class="dot" cx="47" cy="55" r="3"/><circle class="dot" cx="59" cy="55" r="3"/><text class="name" x="91" y="52">Teclado de alarma</text><text class="code" x="91" y="76">TA · operación y armado</text>
  </g>

  <g transform="translate(826 125)">
    <rect class="box" width="374" height="112" rx="5"/><path class="symbol" d="M19 42 H59 V65 H19 Z M59 47 78 38 V68 L59 59 Z"/><text class="name" x="91" y="52">Cámara CCTV</text><text class="code" x="91" y="76">C · captación de vídeo</text>
  </g>
  <g transform="translate(826 243)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="34" width="59" height="40"/><circle class="symbol" cx="48" cy="54" r="10"/><text class="name" x="91" y="52">Grabador DVR / NVR</text><text class="code" x="91" y="76">G · registro y consulta</text>
  </g>
  <g transform="translate(826 361)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="17" y="37" width="61" height="35"/><path class="symbol" d="M29 43 V56 M41 43 V56 M53 43 V56 M65 43 V56"/><text class="name" x="91" y="52">Conmutador PoE</text><text class="code" x="91" y="76">SW · red y alimentación</text>
  </g>
  <g transform="translate(826 479)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="23" y="26" width="48" height="56"/><path class="symbol" d="M31 48 Q47 33 63 48 M36 56 Q47 46 58 56"/><text class="name" x="91" y="52">Lector de acceso</text><text class="code" x="91" y="76">L · presenta credencial</text>
  </g>
  <g transform="translate(826 597)">
    <rect class="box" width="374" height="112" rx="5"/><path class="symbol" d="M22 30 H61 V79 H22 Z M61 43 H76 V67 H61"/><circle class="dot" cx="52" cy="55" r="3"/><text class="name" x="91" y="52">Cierre eléctrico</text><text class="code" x="91" y="76">CE · libera o retiene puerta</text>
  </g>
  <g transform="translate(826 715)">
    <rect class="box" width="374" height="112" rx="5"/><rect class="symbol" x="18" y="34" width="18" height="39"/><rect class="symbol" x="52" y="34" width="18" height="39"/><text class="name" x="91" y="52">Contacto de puerta</text><text class="code" x="91" y="76">CP · confirma estado del acceso</text>
  </g>
  <text x="28" y="869" class="small">No es un plano de proyecto ni una certificación de conformidad. Los símbolos de incendios se contrastan con la norma aplicable.</text>
</svg>
